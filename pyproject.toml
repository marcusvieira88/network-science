[project]
name = "enron-case"
version = "0.1.0"
description = "Headers-only, privacy-first network analysis of the public Enron email corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20",
    "networkx>=3.4",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
enron-case = "enron_case.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enron_case"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["enron_case", "helpers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The generator is test-data code: long, branchy builders are clearer than splitting them.
"src/enron_case/synth/*" = ["PLR0912", "PLR0915", "C901"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["enron_case"]

[[tool.mypy.overrides]]
module = ["networkx.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: runs the sample pipeline end to end"]
