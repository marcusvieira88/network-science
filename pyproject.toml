[project]
name = "enron-case"
version = "0.1.0"
description = "Headers-only, privacy-first network analysis of the public Enron email corpus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars==2.1.0",
    "networkx==3.7",
    "numpy==2.5.4",
    "scipy==1.18.1",
    # Windows has no system time-zone database; zoneinfo needs this one there.
    "tzdata==2026.6; sys_platform == 'win32'",
]

[project.scripts]
enron-case = "enron_case.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enron_case"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["enron_case", "helpers", "network_toys", "risk_fakes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "ANN"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The generator is test-data code: long, branchy builders are clearer than splitting them.
"src/enron_case/synth/*" = ["PLR0912", "PLR0915", "C901"]

[tool.mypy]
python_version = "3.12"
strict = true
# Application code and tests are both type-checked; tests import shared helpers from tests/.
mypy_path = "src:tests"
files = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["networkx.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = ["slow: runs the sample pipeline end to end"]
