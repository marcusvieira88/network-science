name: gate

on:
  push:
  pull_request:

# The gate only reads the repository; no job needs to write anything back.
permissions:
  contents: read

# Both gates run on every OS the one command supports, through the same `enron-case` commands
# that `make gate` and `make ui-gate` call, so the steps are defined once (src/enron_case/config.py).
# Only the synthetic corpus runs here; the real corpus (a 440 MB download) never does.
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to full commit SHAs (tag in the comment), so a moved tag cannot change them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked enron-case gate
      - run: uv run --locked enron-case run --sample

  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          # Kept off: this job needs Python only to launch the UI gate, and saving an empty
          # cache once failed the post step.
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: uv run --locked enron-case ui-gate
