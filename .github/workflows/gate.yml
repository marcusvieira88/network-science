name: gate

on:
  push:
  pull_request:

# The gate only reads the repository; no job needs to write anything back.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tag in the comment), so a moved tag cannot change them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: make gate

  ui:
    runs-on: ubuntu-latest
    if: hashFiles('ui/package.json') != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: make ui-gate
